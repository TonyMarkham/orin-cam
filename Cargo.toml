[workspace]
members         = [
    "crates/image-push",
    "crates/viewer",
    "crates/webserver",
]
resolver        = "3"

[workspace.package]
version         = "0.1.0"
edition         = "2024"

[workspace.dependencies]
axum            = {
    version = "0.8.9",
    features = ["ws"]
}
clap            = {
    version = "4.6.7",
    features = ["derive"]
}
error-location  = { version = "0.1.0" }
thiserror       = { version = "2.0.21" }
tokio           = {
    version = "1.54.1",
    features = ["macros", "net", "rt-multi-thread", "sync", "time"]
}
tower-http      = {
    version = "0.7.1",
    features = ["fs"]
}
ureq            = {
    version = "3.5.0",
    default-features = false
}
wasm-bindgen    = { version = "0.2.130" }
web-sys         = {
    version = "0.3.107",
    features = [
        "Blob", "console", "Document", "Element", "HtmlImageElement", "Location", "MessageEvent",
        "Url", "WebSocket", "Window",
    ]
}

[workspace.lints.clippy]
unwrap_used     = "deny"
expect_used     = "deny"
panic           = "deny"

[workspace.lints.rust]
unused_must_use = "deny"
